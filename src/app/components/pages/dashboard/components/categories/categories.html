<div class="categories-page">
  <div class="page-header">
    <h1 class="page-title">Categories</h1>
    <div class="header-actions">
      <button class="icon-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748B"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
        </svg>
      </button>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94A3B8"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.3-4.3" />
      </svg>
      <input type="text" [(ngModel)]="searchQuery" placeholder="Search categories...">
    </div>
    <button class="new-category-btn" (click)="openAddForm()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14" />
        <path d="M12 5v14" />
      </svg>
      New Category
    </button>
  </div>

  @if (showForm) {
  <div class="simple-form-card">
    <h3>{{ isEditing ? 'Edit Category' : 'Add New Category' }}</h3>

    <div class="form-inputs">
      <div class="form-group">
        <label>Category Name</label>
        <input type="text" [(ngModel)]="categoryName" placeholder="e.g. Antibiotics" class="form-input">
      </div>
    </div>

    <div class="form-actions">
      <button class="btn-cancel" (click)="closeForm()">Cancel</button>
      <button class="btn-save" (click)="saveCategory()">Save</button>
    </div>
  </div>
  }

  <div class="categories-grid">
    @for (category of filteredCategories; track $index) {
    <div class="category-card">
      <div class="card-actions">
        <button class="action-btn edit-btn" (click)="openEditForm($index)" title="Edit">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" />
          </svg>
        </button>
        <button class="action-btn delete-btn" (click)="deleteCategory($index, $event)" title="Delete">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>
        </button>
      </div>

      <div class="card-icon default-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14" />
          <path d="M12 5v14" />
        </svg>
      </div>

      <div class="card-info">
        <h3>{{ category.name }}</h3>
        <p>{{ category.count }} medicines</p>
      </div>
    </div>
    } @empty {
    <div class="empty-state">
      <p>No categories found.</p>
    </div>
    }

    <div class="category-card add-card" (click)="openAddForm()">
      <div class="add-content">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#64748B"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14" />
          <path d="M12 5v14" />
        </svg>
        <span>Add Category</span>
      </div>
    </div>
  </div>
</div>
