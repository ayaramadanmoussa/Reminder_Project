<section class="contact">

    <div class="container">

        <div class="left">

            <span>Get in touch</span>

            <h1>We're here to help</h1>

            <p>
                Questions about your account, a partner hospital,
                or technical support — our team responds within one
                business day.
            </p>

            <div class="info">

                <div class="item">

                    <div class="icon email">
                        <i class="fa-solid fa-envelope"></i>
                    </div>

                    <div>
                        <h4>Email</h4>
                        <small>support@medicare-health.com</small>
                    </div>

                </div>

                <div class="item">

                    <div class="icon phone">
                        <i class="fa-solid fa-phone"></i>
                    </div>

                    <div>
                        <h4>Phone</h4>
                        <small>+1 (800) 555-0148</small>
                    </div>

                </div>

                <div class="item">

                    <div class="icon location">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>

                    <div>
                        <h4>Headquarters</h4>
                        <small>400 Harbor Way, Boston, MA</small>
                    </div>

                </div>

            </div>

        </div>

        <div class="right">

            <div class="card">

                <h2>Send us a message</h2>

                <div class="row">

                    <div class="input-group">
                        <label>Full name</label>
                        <input type="text">
                    </div>

                    <div class="input-group">
                        <label>Email address</label>
                        <input type="email" placeholder="you@example.com">
                    </div>

                </div>

                <div class="input-group">

                    <label>Subject</label>

                    <input
                        type="text"
                        placeholder="Account support">

                </div>

                <div class="input-group">

                    <label>Message</label>

                    <textarea
                        rows="6"
                        placeholder="Tell us how we can help...">
                    </textarea>

                </div>

                <button>
                    Send Message
                </button>

            </div>

        </div>

    </div>

</section>
